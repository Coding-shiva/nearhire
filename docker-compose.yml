version: '3.8'

services:
  # 1. MongoDB with GeoJSON 2dsphere support
  mongodb:
    image: mongo:7.0
    container_name: nearhire-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nearhire
    volumes:
      - mongo_data:/data/db
    networks:
      - nearhire-net

  # 2. Redis for BullMQ Workers and Caching
  redis:
    image: redis:7-alpine
    container_name: nearhire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nearhire-net

  # 3. Backend Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nearhire-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/nearhire
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-nearhire_super_secret_jwt_key_2026_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-nearhire_super_refresh_jwt_key_2026_prod}
      CLIENT_URL: http://localhost:80
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - mongodb
      - redis
    networks:
      - nearhire-net

  # 4. Background Workers Service (BullMQ, Scheduled Ingestion, Expiry Sweeper)
  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: nearhire-workers
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/nearhire
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
      - backend
    networks:
      - nearhire-net

  # 5. Frontend React + Vite + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nearhire-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nearhire-net

volumes:
  mongo_data:
  redis_data:

networks:
  nearhire-net:
    driver: bridge
